<!DOCTYPE html>

  <head>

  <body>
    <a class="skip" href="#main">Skip</a>
    <div class="desk">

        <a class="wm" href="letter.html">Const</a>

          <ul class="index" data-nav></ul>

      </header>
      <main id="main" class="envelope">
        <form class="envelope-inner" data-mail>
          <p class="return">Const<br />from the desk<br />still at the window</p>
          <label for="name">Your name</label>
          <input id="name" name="name" autocomplete="name" />
          <label for="note">Your letter</label>
          <textarea id="note" name="note" required>I read your letter. I am well enough.</textarea>
          <button type="submit">Send</button>
        </form>
      </main>
      <p class="colophon">set a real address in js/site.js</p>
