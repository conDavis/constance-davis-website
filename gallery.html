<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>✩ gallery ✩ Constance Davis</title>
    <meta name="description" content="Drawings and pictures by Con." />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,700;1,400&family=Syne+Mono:wght@400;700&family=Syne+Tactile&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/y2k.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to the gallery</a>
    <div class="marquee-bar">
      <span>✩ Acrylic paintings by me · click a picture to make it BIG ✩</span>
    </div>
    <nav class="site-nav" data-y2k-nav aria-label="Site"></nav>

    <header class="hero">
      <h1 class="site-title">✧ the gallery ✧</h1>
      <p class="tagline">&gt; some art pieces from the past few years &lt;</p>
      <div class="stars-divider">
        ★ ☆ ✦ ✧ ★ ☆ ✦
        <a class="egg" href="letter.html" title="a quieter room">★</a>
      </div>
    </header>

    <div class="page-wrap" id="main">
      <div class="module">
        <div class="module-title">🖼 works</div>
        <div class="module-body">
          <div class="gallery-grid">
            <a class="art-card" href="img/gallery/ive-been-here-before.jpg" data-lightbox>
              <figure>
                <img src="img/gallery/ive-been-here-before.jpg" alt="Surreal painting of an eye held open, the iris filled with several black pupils" />
                <figcaption>i've been here before</figcaption>
              </figure>
            </a>
            <a class="art-card" href="img/gallery/untitled.jpg" data-lightbox>
              <figure>
                <img src="img/gallery/untitled.jpg" alt="Abstract crayon and marker drawing with overlapping loops, bars, and bright color blocks" />
                <figcaption>untitled</figcaption>
              </figure>
            </a>
            <a class="art-card" href="img/gallery/still-life.jpg" data-lightbox>
              <figure>
                <img src="img/gallery/still-life.jpg" alt="Still life of a labeled brick, two avocado halves, and a green book on patterned cloth" />
                <figcaption>still life</figcaption>
              </figure>
            </a>
            <a class="art-card" href="img/gallery/baptism-point.jpg?v=2" data-lightbox>
              <figure>
                <img src="img/gallery/baptism-point.jpg?v=2" alt="Painting of legs in shorts and white sneakers standing on a dark shore facing pastel water" />
                <figcaption>baptism point</figcaption>
              </figure>
            </a>
            <a class="art-card" href="img/gallery/self-portrait.jpg" data-lightbox>
              <figure>
                <img src="img/gallery/self-portrait.jpg" alt="Expressionist self-portrait of three overlapping faces sharing one neck, with the line if it can reach itself is it always safe" />
                <figcaption>self-portrait</figcaption>
              </figure>
            </a>
            <a class="art-card" href="img/gallery/little-girl.jpg" data-lightbox>
              <figure>
                <img src="img/gallery/little-girl.jpg" alt="A small figure in a skirt standing on a colorful cliff, looking into a dark circular void" />
                <figcaption>little girl</figcaption>
              </figure>
            </a>
            <a class="art-card" href="img/gallery/i-can-change.jpg" data-lightbox>
              <figure>
                <img src="img/gallery/i-can-change.jpg" alt="Two figures in yellow sweaters floating upside-down from each other against yellow rose wallpaper" />
                <figcaption>i can change</figcaption>
              </figure>
            </a>
            <a class="art-card" href="img/gallery/if-i-was.jpg" data-lightbox>
              <figure>
                <img src="img/gallery/if-i-was.jpg" alt="Portrait of a black cat looking upward, with a rainbow highlight along the face" />
                <figcaption>if i was</figcaption>
              </figure>
            </a>
            <a class="art-card" href="img/gallery/the-final-show.jpg" data-lightbox>
              <figure>
                <img src="img/gallery/the-final-show.jpg" alt="Painting of seated legs in a patterned skirt and sequined flats, a bandage on one shin" />
                <figcaption>the final show</figcaption>
              </figure>
            </a>
          </div>
        </div>
      </div>
    </div>

    <dialog class="lightbox" id="lightbox">
      <img alt="" />
      <p></p>
      <button type="button" class="lightbox-close" data-close>close this window</button>
    </dialog>

    <footer>
      <p>made with <span class="sparkle-heart">💖</span> by Con</p>
    </footer>
    <script src="js/y2k.js"></script>
  </body>
</html>
